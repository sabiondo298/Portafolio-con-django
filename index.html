<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Juan Giuri Portfolio</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel ="icon" href ="assets/letter-j.png" type ="image/x-icon">
</head>
<body>
    <header class="topographic-strip">
        <a class="home-icon" href="index.html" aria-label="Ir al inicio" title="Inicio">
            <i class="bi bi-house-fill"></i>
        </a>

        <nav class="nav-links" aria-label="Navegación principal">
            <a href="#Myself">Myself</a>
            <a href="#Projects">Projects</a>
            <a href="#Contact">Contact</a>
        </nav>

        <button class="theme-toggle" type="button" aria-label="Activar modo claro" aria-pressed="false" title="Cambiar tema">
            <i class="bi bi-sun-fill" aria-hidden="true"></i>
        </button>
    </header>

    <main class="portfolio-layout">
        <section class="profile-panel" aria-labelledby="profile-title">
            <h1 id="profile-title">Juan Giuri</h1>
            <div class="portrait-frame">
                <img src="assets/pancho123.png" alt="Retrato de Juan Giuri">
            </div>
        </section>

        <section class="content-panels" aria-label="Secciones del portfolio">
            <button id="Myself" class="content-panel content-panel--expandable" type="button" aria-expanded="false" aria-controls="myself-content">
                <span class="panel-label">Myself</span>
                <span class="panel-arrow" aria-hidden="true">+</span>
                <span class="panel-content" id="myself-content">
                    <span class="panel-paragraph">Soy un estudiante de 17 años con interés en seguir creciendo, aprender y enfrentar nuevos desafíos. Me motiva participar en proyectos que me permitan poner en práctica mis conocimientos, desarrollar nuevas habilidades y adquirir experiencia en diferentes áreas.</span>
                    <span class="panel-paragraph">Me considero una persona comprometida con ganas de aprender. Busco nuevas oportunidades y proyectos en los que pueda aportar mis ideas, trabajar en equipo y continuar construyendo mi perfil profesional desde una etapa temprana.</span>
                    <span class="panel-paragraph">Mi objetivo es seguir desarrollándome constantemente y aprovechar cada proyecto como una oportunidad para aprender algo nuevo y acercarme a mis metas profesionales.</span>
                </span>
            </button>
            <article id="Projects" class="content-panel content-panel--projects" role="button" tabindex="0" aria-expanded="false" aria-controls="projects-content">
                <span class="panel-label">Projects</span>
                <span class="panel-arrow" aria-hidden="true">+</span>
                <span class="project-content" id="projects-content">
                    <a class="card border-0 project-card project-card-link" href="https://github.com/Dantelz/save-obama-wishlist-on-steam" target="_blank" rel="noopener noreferrer">
                        <img src="assets/save-him.png" class="card-img-top" alt="Save Obama Game">
                        <span class="card-body">
                            <span class="card-title">Save Obama Game</span>
                        </span>
                    </a>
                    <a class="card border-0 project-card project-card-link slither-card" href="https://github.com/sabiondo298/Trabajo-1er-Bimestre-4AO" target="_blank" rel="noopener noreferrer">
                        <img src="assets/slither-bro.png" class="card-img-top" alt="Slither Juan">
                        <span class="card-body">
                            <span class="card-title">Slither Juan</span>
                        </span>
                    </a>
                </span>
            </article>
            <article id="Contact" class="content-panel content-panel--contact" role="button" tabindex="0" aria-expanded="false" aria-controls="contact-content">
                <span class="panel-label">Contact</span>
                <span class="panel-arrow" aria-hidden="true">+</span>
                <span class="contact-content" id="contact-content">
                    <span class="social-links">
                        <a class="social-link" href="https://www.instagram.com/juan_giuri" target="_blank" rel="noopener noreferrer" aria-label="Instagram de Juan Giuri">
                            <i class="bi bi-instagram" aria-hidden="true"></i>
                            <span>Instagram</span>
                        </a>
                        <a class="social-link" href="https://github.com/sabiondo298" target="_blank" rel="noopener noreferrer" aria-label="GitHub de Juan Giuri">
                            <i class="bi bi-github" aria-hidden="true"></i>
                            <span>GitHub</span>
                        </a>
                        <a class="social-link" href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                            <i class="bi bi-linkedin" aria-hidden="true"></i>
                            <span>LinkedIn</span>
                        </a>
                        <a class="social-link" href="assets/CV_Juan_Giuri.pdf" target="_blank" rel="noopener noreferrer" aria-label="Abrir CV de Juan Giuri">
                            <i class="bi bi-google" aria-hidden="true"></i>
                            <span>CV</span>
                        </a>
                    </span>
                    <span class="contact-mail">Mail: juangiuri@gmail.com</span>
                </span>
            </article>
        </section>
    </main>

    <footer class="site-footer">
        <p>© 2026 Juan Giuri all rights reserved</p>
    </footer>

    <script>
        requestAnimationFrame(() => document.body.classList.add("page-ready"));

        const myselfPanel = document.querySelector(".content-panel--expandable");

        myselfPanel.addEventListener("click", () => {
            const isExpanded = myselfPanel.classList.toggle("is-expanded");
            myselfPanel.parentElement.classList.toggle("has-expanded", isExpanded);
            myselfPanel.setAttribute("aria-expanded", String(isExpanded));
        });

        const projectsPanel = document.querySelector(".content-panel--projects");

        const toggleProjects = () => {
            const isExpanded = projectsPanel.classList.toggle("is-expanded");
            projectsPanel.parentElement.classList.toggle("has-expanded", isExpanded);
            projectsPanel.setAttribute("aria-expanded", String(isExpanded));
        };

        projectsPanel.addEventListener("click", (event) => {
            if (!event.target.closest(".project-card-link")) {
                toggleProjects();
            }
        });

        projectsPanel.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                toggleProjects();
            }
        });

        const contactPanel = document.querySelector(".content-panel--contact");

        const toggleContact = () => {
            const isExpanded = contactPanel.classList.toggle("is-expanded");
            contactPanel.parentElement.classList.toggle("has-expanded", isExpanded);
            contactPanel.setAttribute("aria-expanded", String(isExpanded));
        };

        contactPanel.addEventListener("click", (event) => {
            if (!event.target.closest(".social-link")) {
                toggleContact();
            }
        });

        contactPanel.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                toggleContact();
            }
        });

        const themeToggle = document.querySelector(".theme-toggle");
        const savedTheme = localStorage.getItem("portfolio-theme");

        if (savedTheme === "light") {
            document.body.classList.add("light-mode");
            themeToggle.setAttribute("aria-pressed", "true");
            themeToggle.setAttribute("aria-label", "Activar modo oscuro");
            themeToggle.innerHTML = '<i class="bi bi-moon-fill" aria-hidden="true"></i>';
        }

        themeToggle.addEventListener("click", () => {
            const isLightMode = document.body.classList.toggle("light-mode");
            themeToggle.setAttribute("aria-pressed", String(isLightMode));
            themeToggle.setAttribute("aria-label", isLightMode ? "Activar modo oscuro" : "Activar modo claro");
            themeToggle.innerHTML = isLightMode
                ? '<i class="bi bi-moon-fill" aria-hidden="true"></i>'
                : '<i class="bi bi-sun-fill" aria-hidden="true"></i>';
            localStorage.setItem("portfolio-theme", isLightMode ? "light" : "dark");
        });
    </script>
</body>
</html>

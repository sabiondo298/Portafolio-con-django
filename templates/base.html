{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Juan Giuri{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="site-shell">
    <header class="topographic-strip">
        <a class="home-icon" href="/" aria-label="Ir al inicio" title="Inicio"><i class="bi bi-house-fill"></i></a>
        <nav class="nav-links" aria-label="Navegación principal">
            <a href="/#Myself">Myself</a>
            <a href="/#Projects">Projects</a>
            <a href="/#Contact">Contact</a>
        </nav>
        <a class="blog-button" href="{% url 'blog:post_list' %}">Blog</a>
        <button class="theme-toggle" type="button" aria-label="Activar modo claro" aria-pressed="false" title="Cambiar tema"><i class="bi bi-sun-fill" aria-hidden="true"></i></button>
    </header>
    {% block content %}{% endblock %}
    <footer class="site-footer"><p>© 2026 Juan Giuri all rights reserved</p></footer>
    <script>
        requestAnimationFrame(() => document.body.classList.add("page-ready"));
        const themeToggle = document.querySelector(".theme-toggle");
        const savedTheme = localStorage.getItem("portfolio-theme");
        if (savedTheme === "light") {
            document.body.classList.add("light-mode");
            themeToggle.setAttribute("aria-pressed", "true");
            themeToggle.setAttribute("aria-label", "Activar modo oscuro");
            themeToggle.innerHTML = '<i class="bi bi-moon-fill" aria-hidden="true"></i>';
        }
        themeToggle.addEventListener("click", () => {
            const isLightMode = document.body.classList.toggle("light-mode");
            themeToggle.setAttribute("aria-pressed", String(isLightMode));
            themeToggle.setAttribute("aria-label", isLightMode ? "Activar modo oscuro" : "Activar modo claro");
            themeToggle.innerHTML = isLightMode ? '<i class="bi bi-moon-fill" aria-hidden="true"></i>' : '<i class="bi bi-sun-fill" aria-hidden="true"></i>';
            localStorage.setItem("portfolio-theme", isLightMode ? "light" : "dark");
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
